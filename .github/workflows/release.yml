name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify manifest version matches tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import json; print(json.load(open("custom_components/cursor_usage/manifest.json"))["version"])')"
          echo "Tag: ${GITHUB_REF_NAME} (normalized: ${tag})"
          echo "Manifest version: ${version}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::manifest.json version (${version}) does not match release tag (${tag})"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
