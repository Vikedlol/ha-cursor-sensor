name: Auto Release

# When manifest.json version on main has no GitHub Release yet, create the
# matching tag + release so HACS users are not stuck on commit-SHA versioning.
# Manual tag pushes still work via release.yml.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read manifest version
        id: version
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("custom_components/cursor_usage/manifest.json"))["version"])')"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-].*)?$ ]]; then
            echo "::error::Invalid version in manifest.json: ${version}"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Manifest version: ${version}"

      - name: Check existing release or tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          if gh release view "${version}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Release ${version} already exists — skipping"
            exit 0
          fi

          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Release v${version} already exists — skipping"
            exit 0
          fi

          if git rev-parse "refs/tags/${version}" >/dev/null 2>&1 \
            || git rev-parse "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Tag for ${version} already exists without a release — skipping auto-create (use release.yml / manual release)"
            exit 0
          fi

          echo "exists=false" >> "${GITHUB_OUTPUT}"
          echo "No release or tag for ${version} — will create"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: false
